<style>/* mascots */
.buddy{display:inline-block;position:relative;line-height:0;flex:none}
.buddy svg{width:100%;height:auto;overflow:visible;transform-origin:50% 92%}
.buddy .e-happy,.buddy .e-sad,.buddy .m-sad,.buddy .tear{display:none}
.buddy[data-mood="happy"] .e-norm,.buddy[data-mood="sad"] .e-norm{display:none}
.buddy[data-mood="happy"] .e-happy{display:inline}
.buddy[data-mood="sad"] .e-sad,.buddy[data-mood="sad"] .m-sad,.buddy[data-mood="sad"] .tear{display:inline}
.buddy[data-mood="sad"] .m-norm{display:none}
.buddy[data-mood="idle"] svg{animation:bob 3.2s ease-in-out infinite}
.buddy[data-mood="happy"] svg{animation:dance .5s ease-in-out 3}
.buddy[data-mood="sad"] svg{animation:droop 1.4s ease-out forwards}
.buddy .lids{transform-origin:center;animation:blink 5s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
@keyframes dance{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-10deg)}50%{transform:translateY(0) rotate(0) scale(1.06,.94)}75%{transform:translateY(-12px) rotate(10deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes droop{0%{transform:none}30%{transform:translateY(3px) rotate(-4deg) scale(1.02,.96)}100%{transform:translateY(4px) rotate(-6deg) scale(1,.95)}}
@keyframes blink{0%,94%,100%{opacity:0}96%{opacity:1}}
</style>
<style>
/* Layout: one-column speaking trainer, max 640px. Dark stage, big microphone, live transcript, instant feedback; mascot reacts. */
:root{
  --bg:#22264a; --card:rgb(255 255 255/.07); --fg:#f5f6ff; --muted:#b9bde3; --line:rgb(255 255 255/.14);
  --pop:#ff7a5c; --ok:#3fd6bf; --bad:#ff7b82; --warn:#f3ad4b; --dani:#79cf74; --emma:#bf98f2;
  --f-display:"Fredoka",ui-rounded,system-ui,sans-serif; --f-body:"Atkinson Hyperlegible Next",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
html,body{overflow-x:hidden}
.top h1{font-size:1.25rem;margin-right:auto}
.top h1 b{color:var(--pop)}
.who{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:999px}
.who button{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-weight:700;color:var(--muted);font-size:.88rem}
.who button .buddy{width:22px}
.who button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.back{color:var(--muted);font-weight:700;font-size:.9rem}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgb(255 122 92/.22),rgb(63 214 191/.18))}
.hero .buddy{width:92px}
.hero p{color:var(--muted);font-size:.92rem}
.modes{display:grid;gap:10px}
.mode{display:grid;gap:4px;text-align:left;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.mode strong{font-family:var(--f-display);font-weight:600;font-size:1.08rem}
.mode span{color:var(--muted);font-size:.88rem}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.ok{background:var(--ok)} .prog i.ko{background:var(--bad)} .prog i.cur{background:var(--fg)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.target{font-family:var(--f-display);font-size:clamp(1.5rem,6vw,2.2rem);font-weight:600;line-height:1.3}
.target .w{border-radius:6px;padding:0 3px}
.target .w.ok{background:rgb(63 214 191/.3)}
.target .w.ko{background:rgb(255 123 130/.38);text-decoration:underline wavy}
.ipa{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;font-weight:700}
.btn.primary{background:var(--pop);color:#2a1610}
.btn.soft{background:var(--card);border:1px solid var(--line)}
.btn.ghost{color:var(--muted);padding-inline:10px}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88rem}
.stage{display:grid;justify-items:center;gap:10px;padding:8px 0}
.mic{width:112px;height:112px;border-radius:50%;background:var(--pop);display:grid;place-items:center;box-shadow:0 10px 30px rgb(255 122 92/.45);position:relative}
.mic svg{width:46px;height:46px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:#ff5a3a}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--pop);animation:pulse 1.2s ease-out infinite}
.mic.on::after{animation-delay:.6s}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.mic-label{font-weight:700;color:var(--muted);font-size:.92rem;text-align:center}
.live{min-height:2.6em;text-align:center;font-size:1.1rem;color:var(--fg);opacity:.9}
.feed{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--card);border-left:5px solid var(--ok)}
.feed.ko{border-left-color:var(--bad)} .feed.mid{border-left-color:var(--warn)}
.feed strong{font-family:var(--f-display);font-size:1.15rem}
.feed .tip{color:var(--muted);font-size:.9rem}
.err{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:rgb(255 255 255/.05)}
.err s{opacity:.7} .err b{color:var(--ok)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{padding:18px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.choice button.ok{background:var(--ok);color:var(--bg)} .choice button.ko{background:var(--bad);color:var(--bg)}
.scene{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scene div{padding:10px;border-radius:12px;background:var(--card);font-size:.92rem}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos figure{margin:0;display:grid;gap:4px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--card)}
.photos figcaption{font-size:.68rem;color:var(--muted);line-height:1.3}
.photo1 img{width:100%;max-height:42vh;object-fit:cover;border-radius:14px}
.chat{display:grid;gap:8px}
.bub{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.4;font-size:1rem}
.bub.ai{background:var(--card);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.bub.me{background:var(--pop);color:#2a1610;justify-self:end;border-bottom-right-radius:4px}
.bub.typing{opacity:.7;font-style:italic}
.keybox{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.keybox input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgb(0 0 0/.2);color:var(--fg)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.topics button{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-weight:700}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.end{display:grid;gap:12px;justify-items:start}
.end .big{font-family:var(--f-display);font-size:4rem;font-weight:700;color:var(--ok);line-height:1}
.note{font-size:.82rem;color:var(--muted)}
.corner{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:70px;z-index:5;pointer-events:none}
.corner .buddy{width:70px}
.timer{font-family:var(--f-display);font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>Inglés<b>·</b>juntos <span style="color:var(--muted);font-weight:500;white-space:nowrap">· habla</span></h1>

</div>

<script>const PRON={"words": [{"w": "comfortable", "ipa": "/ˈkʌmftəbl/", "es_tip": "Se dice en 3 sílabas: KUMF-tuh-bul; no 'com-for-ta-ble'.", "es": "cómodo", "cat": "sílabas mudas"}, {"w": "vegetable", "ipa": "/ˈvedʒtəbl/", "es_tip": "3 sílabas: VEJ-tuh-bul. La segunda 'e' desaparece y la 'g' suena como 'y' fuerte (/dʒ/).", "es": "verdura", "cat": "sílabas mudas"}, {"w": "Wednesday", "ipa": "/ˈwenzdeɪ/", "es_tip": "2 sílabas: WENZ-dei. La primera 'd' no se pronuncia.", "es": "miércoles", "cat": "sílabas mudas"}, {"w": "chocolate", "ipa": "/ˈtʃɒklət/", "es_tip": "2 sílabas: CHOK-lut. Nada de 'cho-co-la-te'.", "es": "chocolate", "cat": "sílabas mudas"}, {"w": "different", "ipa": "/ˈdɪfrənt/", "es_tip": "2 sílabas: DIF-runt. La 'e' del medio casi desaparece.", "es": "diferente", "cat": "sílabas mudas"}, {"w": "interesting", "ipa": "/ˈɪntrəstɪŋ/", "es_tip": "3 sílabas con acento al principio: IN-truh-sting. No 'in-te-res-tin'.", "es": "interesante", "cat": "sílabas mudas"}, {"w": "temperature", "ipa": "/ˈtemprətʃə/", "es_tip": "TEM-pruh-chuh. El final '-ture' suena 'chuh', no 'tu-re'.", "es": "temperatura", "cat": "sílabas mudas"}, {"w": "business", "ipa": "/ˈbɪznəs/", "es_tip": "2 sílabas: BIZ-nis. La 'u' suena 'i' y la 'i' del medio no suena.", "es": "negocio, empresa", "cat": "sílabas mudas"}, {"w": "family", "ipa": "/ˈfæmli/", "es_tip": "Normalmente 2 sílabas: FAM-li.", "es": "familia", "cat": "sílabas mudas"}, {"w": "island", "ipa": "/ˈaɪlənd/", "es_tip": "La 's' es muda: AI-lund.", "es": "isla", "cat": "letras mudas"}, {"w": "knife", "ipa": "/naɪf/", "es_tip": "La 'k' inicial delante de 'n' no suena: NAIF.", "es": "cuchillo", "cat": "letras mudas"}, {"w": "knowledge", "ipa": "/ˈnɒlɪdʒ/", "es_tip": "'k' muda y la 'ow' suena 'o' corta: NOL-ij.", "es": "conocimiento", "cat": "letras mudas"}, {"w": "climb", "ipa": "/klaɪm/", "es_tip": "La 'b' final tras 'm' no suena: KLAIM.", "es": "escalar, subir", "cat": "letras mudas"}, {"w": "doubt", "ipa": "/daʊt/", "es_tip": "La 'b' es muda: DAUT.", "es": "duda, dudar", "cat": "letras mudas"}, {"w": "receipt", "ipa": "/rɪˈsiːt/", "es_tip": "La 'p' es muda: ri-SIIT.", "es": "recibo, tique", "cat": "letras mudas"}, {"w": "listen", "ipa": "/ˈlɪsn/", "es_tip": "La 't' es muda: LIS-n.", "es": "escuchar", "cat": "letras mudas"}, {"w": "castle", "ipa": "/ˈkɑːsl/", "es_tip": "La 't' es muda: KAA-sul.", "es": "castillo", "cat": "letras mudas"}, {"w": "honest", "ipa": "/ˈɒnɪst/", "es_tip": "Aquí la 'h' sí es muda: ON-ist. Por eso se dice 'an honest person'.", "es": "honesto, sincero", "cat": "letras mudas"}, {"w": "hour", "ipa": "/ˈaʊə/", "es_tip": "'h' muda: AU-uh. Se dice 'an hour'.", "es": "hora", "cat": "letras mudas"}, {"w": "foreign", "ipa": "/ˈfɒrən/", "es_tip": "La 'g' es muda: FOR-un.", "es": "extranjero", "cat": "letras mudas"}, {"w": "salmon", "ipa": "/ˈsæmən/", "es_tip": "La 'l' es muda: SAM-un.", "es": "salmón", "cat": "letras mudas"}, {"w": "walk", "ipa": "/wɔːk/", "es_tip": "La 'l' no suena: WOOK. Igual en 'talk'.", "es": "caminar, paseo", "cat": "letras mudas"}, {"w": "would", "ipa": "/wʊd/", "es_tip": "La 'l' no suena: WUD. Igual que 'could' y 'should'.", "es": "(condicional)", "cat": "letras mudas"}, {"w": "answer", "ipa": "/ˈɑːnsə/", "es_tip": "La 'w' es muda: AAN-suh.", "es": "respuesta, responder", "cat": "letras mudas"}, {"w": "psychology", "ipa": "/saɪˈkɒlədʒi/", "es_tip": "La 'p' inicial no suena: sai-KOL-uh-ji.", "es": "psicología", "cat": "letras mudas"}, {"w": "worked", "ipa": "/wɜːkt/", "es_tip": "Tras sonido sordo (/k/), '-ed' suena /t/: WURKT, una sílaba. Nunca 'wor-ked'.", "es": "trabajó", "cat": "-ed"}, {"w": "watched", "ipa": "/wɒtʃt/", "es_tip": "Una sílaba: WOCHT. '-ed' suena /t/.", "es": "vio, miró", "cat": "-ed"}, {"w": "stopped", "ipa": "/stɒpt/", "es_tip": "Una sílaba: STOPT. Y sin 'e' delante de la s.", "es": "paró", "cat": "-ed"}, {"w": "relaxed", "ipa": "/rɪˈlækst/", "es_tip": "-ed suena /t/: ri-LAKST, dos sílabas.", "es": "relajado", "cat": "-ed"}, {"w": "played", "ipa": "/pleɪd/", "es_tip": "Tras sonido sonoro, '-ed' suena /d/: PLEID, una sílaba.", "es": "jugó", "cat": "-ed"}, {"w": "lived", "ipa": "/lɪvd/", "es_tip": "Una sílaba: LIVD. '-ed' suena /d/.", "es": "vivió", "cat": "-ed"}, {"w": "decided", "ipa": "/dɪˈsaɪdɪd/", "es_tip": "Solo tras /t/ o /d/ se añade sílaba: di-SAI-did.", "es": "decidió", "cat": "-ed"}, {"w": "wanted", "ipa": "/ˈwɒntɪd/", "es_tip": "Tras /t/, '-ed' suena /ɪd/: WON-tid, dos sílabas.", "es": "quería", "cat": "-ed"}, {"w": "interested", "ipa": "/ˈɪntrəstɪd/", "es_tip": "IN-truh-stid. Acento en la primera sílaba y '-ed' como /ɪd/.", "es": "interesado", "cat": "-ed"}, {"w": "about", "ipa": "/əˈbaʊt/", "es_tip": "La 'a' inicial es schwa /ə/, una vocal débil y relajada: uh-BAUT.", "es": "sobre, acerca de", "cat": "schwa"}, {"w": "problem", "ipa": "/ˈprɒbləm/", "es_tip": "La 'e' final es schwa: PROB-lum, no 'prob-lem'.", "es": "problema", "cat": "schwa"}, {"w": "photographer", "ipa": "/fəˈtɒɡrəfə/", "es_tip": "Acento en la 2ª sílaba: fuh-TOG-ruh-fuh. Las demás vocales son schwa.", "es": "fotógrafo", "cat": "schwa"}, {"w": "computer", "ipa": "/kəmˈpjuːtə/", "es_tip": "kum-PIU-tuh. La 'o' y la 'er' final son schwa.", "es": "ordenador", "cat": "schwa"}, {"w": "very", "ipa": "/ˈveri/", "es_tip": "La 'v' se hace con los dientes de arriba sobre el labio inferior, vibrando. No 'beri'.", "es": "muy", "cat": "/v/ vs /b/"}, {"w": "travel", "ipa": "/ˈtrævl/", "es_tip": "TRA-vul, con /v/ labiodental. 'Trabel' cambia el sonido.", "es": "viajar", "cat": "/v/ vs /b/"}, {"w": "believe", "ipa": "/bɪˈliːv/", "es_tip": "Empieza con /b/ (labios juntos) y termina con /v/ (dientes y labio): bi-LIIV.", "es": "creer", "cat": "/v/ vs /b/"}, {"w": "available", "ipa": "/əˈveɪləbl/", "es_tip": "uh-VEI-luh-bul: /v/ en medio y /b/ al final. Acento en 'VEI'.", "es": "disponible", "cat": "/v/ vs /b/"}, {"w": "vote", "ipa": "/vəʊt/", "es_tip": "/v/ vibrando: VOUT. 'Bote' es otra palabra (boat).", "es": "votar, voto", "cat": "/v/ vs /b/"}, {"w": "should", "ipa": "/ʃʊd/", "es_tip": "/ʃ/ es como el 'sh' para pedir silencio: SHUD. La 'l' es muda.", "es": "debería", "cat": "/ʃ/"}, {"w": "sure", "ipa": "/ʃɔː/", "es_tip": "Empieza con /ʃ/ ('sh'), no con 's': SHOO.", "es": "seguro", "cat": "/ʃ/"}, {"w": "machine", "ipa": "/məˈʃiːn/", "es_tip": "La 'ch' suena 'sh' y la 'i' es larga: muh-SHIIN.", "es": "máquina", "cat": "/ʃ/"}, {"w": "information", "ipa": "/ˌɪnfəˈmeɪʃn/", "es_tip": "'-tion' siempre suena 'shun': in-fuh-MEI-shun. Acento en 'MEI'.", "es": "información", "cat": "/ʃ/"}, {"w": "job", "ipa": "/dʒɒb/", "es_tip": "/dʒ/ es como una 'ch' sonora, tipo 'y' muy fuerte: DJOB. No 'yob' ni 'job' con jota.", "es": "trabajo", "cat": "/dʒ/"}, {"w": "journey", "ipa": "/ˈdʒɜːni/", "es_tip": "DJUR-ni. La 'j' inglesa nunca es la jota española.", "es": "viaje, trayecto", "cat": "/dʒ/"}, {"w": "manager", "ipa": "/ˈmænɪdʒə/", "es_tip": "MAN-i-djuh. Acento en la primera sílaba, 'g' como /dʒ/.", "es": "gerente, jefe", "cat": "/dʒ/"}, {"w": "yellow", "ipa": "/ˈjeləʊ/", "es_tip": "Empieza con /j/ suave (como 'i'), no con /dʒ/: YE-lou. Compara con 'jello'.", "es": "amarillo", "cat": "/dʒ/"}, {"w": "Spain", "ipa": "/speɪn/", "es_tip": "Empieza directamente por 's': SPEIN. Nada de 'espein'.", "es": "España", "cat": "s + consonante"}, {"w": "student", "ipa": "/ˈstjuːdnt/", "es_tip": "STIU-dnt, sin 'e' delante. Practica alargando la 's': sssstudent.", "es": "estudiante", "cat": "s + consonante"}, {"w": "school", "ipa": "/skuːl/", "es_tip": "SKUUL, sin 'e' inicial y con 'u' larga.", "es": "colegio, escuela", "cat": "s + consonante"}, {"w": "special", "ipa": "/ˈspeʃl/", "es_tip": "SPESH-ul: sin 'e' inicial y la 'ci' suena /ʃ/.", "es": "especial", "cat": "s + consonante"}, {"w": "stressed", "ipa": "/strest/", "es_tip": "Una sola sílaba: STREST. Sin 'e' delante y '-ed' como /t/.", "es": "estresado", "cat": "s + consonante"}, {"w": "hotel", "ipa": "/həʊˈtel/", "es_tip": "La 'h' es un soplo suave (no jota) y el acento va al final: hou-TEL.", "es": "hotel", "cat": "/h/"}, {"w": "hungry", "ipa": "/ˈhʌŋɡri/", "es_tip": "'h' aspirada suave, como empañar un cristal: HUNG-gri.", "es": "hambriento", "cat": "/h/"}, {"w": "behind", "ipa": "/bɪˈhaɪnd/", "es_tip": "No te comas la 'h' del medio: bi-HAIND.", "es": "detrás", "cat": "/h/"}, {"w": "people", "ipa": "/ˈpiːpl/", "es_tip": "'i' larga /iː/: PII-pul. Sin 'o'.", "es": "gente", "cat": "/iː/ vs /ɪ/"}, {"w": "women", "ipa": "/ˈwɪmɪn/", "es_tip": "Sorpresa: WIM-in. Singular 'woman' = WUM-un.", "es": "mujeres", "cat": "/iː/ vs /ɪ/"}, {"w": "busy", "ipa": "/ˈbɪzi/", "es_tip": "La 'u' suena /ɪ/: BI-zi.", "es": "ocupado", "cat": "/iː/ vs /ɪ/"}, {"w": "develop", "ipa": "/dɪˈveləp/", "es_tip": "Acento en la 2ª: di-VEL-up. No 'DE-ve-lop'.", "es": "desarrollar", "cat": "acento"}, {"w": "event", "ipa": "/ɪˈvent/", "es_tip": "Acento al final: i-VENT.", "es": "evento", "cat": "acento"}, {"w": "success", "ipa": "/səkˈses/", "es_tip": "suhk-SES, acento al final. Y '-ful' en 'successful': suhk-SES-ful.", "es": "éxito", "cat": "acento"}, {"w": "Europe", "ipa": "/ˈjʊərəp/", "es_tip": "YUU-rup: empieza con /j/ y acento en la primera.", "es": "Europa", "cat": "acento"}, {"w": "advertisement", "ipa": "/ədˈvɜːtɪsmənt/", "es_tip": "En inglés británico: ud-VUR-tis-munt, acento en la 2ª.", "es": "anuncio", "cat": "acento"}, {"w": "recipe", "ipa": "/ˈresəpi/", "es_tip": "3 sílabas: RE-suh-pi. No 'ri-saip'.", "es": "receta", "cat": "acento"}, {"w": "photograph", "ipa": "/ˈfəʊtəɡrɑːf/", "es_tip": "FOU-tuh-graaf: acento en la 1ª. Compara con phoTOgrapher.", "es": "fotografía", "cat": "acento"}, {"w": "think", "ipa": "/θɪŋk/", "es_tip": "/θ/ es como la 'z' de España: lengua entre los dientes. No 'tink' ni 'sink'.", "es": "pensar", "cat": "th"}, {"w": "three", "ipa": "/θriː/", "es_tip": "Como 'zrii' con 'z' castellana. Distinto de 'tree' (árbol).", "es": "tres", "cat": "th"}, {"w": "clothes", "ipa": "/kləʊðz/", "es_tip": "/ð/ es como la 'd' suave de 'nada'. Muchos nativos dicen simplemente 'klouz'.", "es": "ropa", "cat": "th"}, {"w": "months", "ipa": "/mʌnθs/", "es_tip": "MUNTHS: tras la 'n', pon la lengua entre los dientes y luego 's'.", "es": "meses", "cat": "th"}, {"w": "weather", "ipa": "/ˈweðə/", "es_tip": "WE-dhuh, con la 'd' suave de 'cada'. Igual que 'whether'.", "es": "tiempo (clima)", "cat": "th"}, {"w": "although", "ipa": "/ɔːlˈðəʊ/", "es_tip": "ool-DHOU: acento al final, 'gh' mudo.", "es": "aunque", "cat": "th"}, {"w": "breakfast", "ipa": "/ˈbrekfəst/", "es_tip": "BREK-fust, no 'break-fast'.", "es": "desayuno", "cat": "vocales"}, {"w": "said", "ipa": "/sed/", "es_tip": "SED, no 'seid'. Y 'says' = SEZ.", "es": "dijo", "cat": "vocales"}, {"w": "enough", "ipa": "/ɪˈnʌf/", "es_tip": "i-NUF: 'gh' suena /f/.", "es": "suficiente", "cat": "vocales"}, {"w": "queue", "ipa": "/kjuː/", "es_tip": "Se dice como la letra Q: KIUU.", "es": "cola, fila", "cat": "vocales"}, {"w": "area", "ipa": "/ˈeəriə/", "es_tip": "EE-ri-uh, no 'a-re-a'.", "es": "zona", "cat": "vocales"}], "pairs": [{"a": "ship", "b": "sheep", "ipa_a": "/ʃɪp/", "ipa_b": "/ʃiːp/", "es_tip": "/ɪ/ es corta y relajada, entre 'i' y 'e'. /iː/ es larga y con sonrisa."}, {"a": "live", "b": "leave", "ipa_a": "/lɪv/", "ipa_b": "/liːv/", "es_tip": "'live' (vivir) corta; 'leave' (irse) larga. Confundirlas cambia el mensaje."}, {"a": "fill", "b": "feel", "ipa_a": "/fɪl/", "ipa_b": "/fiːl/", "es_tip": "Alarga la vocal en 'feel' y estira los labios."}, {"a": "sit", "b": "seat", "ipa_a": "/sɪt/", "ipa_b": "/siːt/", "es_tip": "'sit' rápida y relajada; 'seat' larga."}, {"a": "full", "b": "fool", "ipa_a": "/fʊl/", "ipa_b": "/fuːl/", "es_tip": "/ʊ/ corta y floja; /uː/ larga con labios redondeados."}, {"a": "cat", "b": "cut", "ipa_a": "/kæt/", "ipa_b": "/kʌt/", "es_tip": "/æ/: abre mucho la boca, entre 'a' y 'e'. /ʌ/: 'a' corta y central, boca menos abierta."}, {"a": "hat", "b": "heart", "ipa_a": "/hæt/", "ipa_b": "/hɑːt/", "es_tip": "/æ/ corta y abierta; /ɑː/ larga y profunda, desde la garganta. La 'r' no suena en inglés británico."}, {"a": "bad", "b": "bed", "ipa_a": "/bæd/", "ipa_b": "/bed/", "es_tip": "'bed' es la 'e' española; 'bad' abre más la boca, casi 'a'."}, {"a": "walk", "b": "work", "ipa_a": "/wɔːk/", "ipa_b": "/wɜːk/", "es_tip": "'walk' con 'o' larga y labios redondos; 'work' con vocal neutra larga, labios relajados."}, {"a": "berry", "b": "very", "ipa_a": "/ˈberi/", "ipa_b": "/ˈveri/", "es_tip": "/b/ con los dos labios; /v/ con dientes superiores sobre el labio inferior."}, {"a": "boat", "b": "vote", "ipa_a": "/bəʊt/", "ipa_b": "/vəʊt/", "es_tip": "Mismo truco: si no notas vibración en el labio inferior, no es /v/."}, {"a": "best", "b": "vest", "ipa_a": "/best/", "ipa_b": "/vest/", "es_tip": "'best' (mejor) vs 'vest' (camiseta interior). Exagera la /v/ al practicar."}, {"a": "sea", "b": "she", "ipa_a": "/siː/", "ipa_b": "/ʃiː/", "es_tip": "/s/ con sonrisa; /ʃ/ con labios hacia fuera, como pidiendo silencio."}, {"a": "sort", "b": "short", "ipa_a": "/sɔːt/", "ipa_b": "/ʃɔːt/", "es_tip": "Redondea y adelanta los labios para /ʃ/."}, {"a": "chip", "b": "ship", "ipa_a": "/tʃɪp/", "ipa_b": "/ʃɪp/", "es_tip": "/tʃ/ es la 'ch' española (con golpe); /ʃ/ es continua, sin golpe."}, {"a": "watch", "b": "wash", "ipa_a": "/wɒtʃ/", "ipa_b": "/wɒʃ/", "es_tip": "'watch' termina con golpe 'ch'; 'wash' con 'sh' suave y continua."}, {"a": "yet", "b": "jet", "ipa_a": "/jet/", "ipa_b": "/dʒet/", "es_tip": "/j/ es una 'i' rápida; /dʒ/ es una 'ch' sonora. 'Yes' no es 'jes'."}, {"a": "year", "b": "ear", "ipa_a": "/jɪə/", "ipa_b": "/ɪə/", "es_tip": "'year' empieza con una 'i' rápida (/j/); 'ear' empieza directamente con la vocal."}, {"a": "hate", "b": "eight", "ipa_a": "/heɪt/", "ipa_b": "/eɪt/", "es_tip": "La /h/ es un soplo suave: si te la comes, 'I hate it' se convierte en 'I eight it'."}, {"a": "hold", "b": "old", "ipa_a": "/həʊld/", "ipa_b": "/əʊld/", "es_tip": "Soplo suave para la 'h', nunca jota."}, {"a": "think", "b": "sink", "ipa_a": "/θɪŋk/", "ipa_b": "/sɪŋk/", "es_tip": "/θ/ con la lengua entre los dientes, como la 'z' de 'zapato'."}, {"a": "three", "b": "tree", "ipa_a": "/θriː/", "ipa_b": "/triː/", "es_tip": "'three' con 'z' castellana; 'tree' con 't' normal."}, {"a": "they", "b": "day", "ipa_a": "/ðeɪ/", "ipa_b": "/deɪ/", "es_tip": "/ð/ es la 'd' suave de 'cada', lengua entre dientes; /d/ es la 'd' fuerte de 'dedo'."}, {"a": "worked", "b": "work", "ipa_a": "/wɜːkt/", "ipa_b": "/wɜːk/", "es_tip": "La única diferencia es una /t/ final muy corta. Sin ella, el pasado desaparece."}, {"a": "play", "b": "played", "ipa_a": "/pleɪ/", "ipa_b": "/pleɪd/", "es_tip": "Añade una /d/ suave al final, sin sílaba extra."}, {"a": "light", "b": "right", "ipa_a": "/laɪt/", "ipa_b": "/raɪt/", "es_tip": "La 'r' inglesa no vibra: la lengua no toca el paladar y los labios se redondean un poco."}, {"a": "pull", "b": "pool", "ipa_a": "/pʊl/", "ipa_b": "/puːl/", "es_tip": "'pull' (tirar) corta; 'pool' (piscina) larga."}, {"a": "beach", "b": "bitch", "ipa_a": "/biːtʃ/", "ipa_b": "/bɪtʃ/", "es_tip": "Par delicado: 'beach' siempre larga y con sonrisa. 'bitch' es un insulto. Lo mismo con 'sheet' y 'shit'."}], "sentences": [{"level": "A2", "s": "I'm from Spain, but I live in a small town near Madrid.", "focus": "s + consonante (Spain, small)", "es_tip": "Sin 'e' delante de 'Spain' ni de 'small'. Une 'live in a' como una sola palabra: 'li-vi-na'."}, {"level": "A2", "s": "I usually get up at seven and have breakfast at home.", "focus": "/v/, /h/ y 'breakfast'", "es_tip": "'seven' con /v/; 'have' y 'home' con soplo suave; BREK-fust."}, {"level": "A2", "s": "She works in a hotel and she really likes her job.", "focus": "-s de tercera persona, /dʒ/", "es_tip": "Que se oiga la 's' de 'works' y 'likes'. 'job' con /dʒ/, nunca con jota."}, {"level": "A2", "s": "We watched a film last night and it was very funny.", "focus": "-ed como /t/, /v/", "es_tip": "'watched' es una sola sílaba: WOCHT. 'very' con /v/ labiodental."}, {"level": "A2", "s": "There are three bedrooms and a big kitchen in my flat.", "focus": "th /ð/ y /θ/", "es_tip": "'There' con /ð/ suave; 'three' con 'z' castellana."}, {"level": "A2", "s": "Can I have a glass of water, please?", "focus": "forma débil de 'can' y 'of'", "es_tip": "'Can I' suena 'kuh-nai' y 'of' casi 'uv'. Entonación subiendo al final por cortesía."}, {"level": "A2", "s": "I'd like to visit London because I've never been there.", "focus": "contracciones I'd, I've", "es_tip": "Practica 'aid laik' y 'aiv nevuh'. 'been' suele sonar 'bin'."}, {"level": "A2", "s": "It's quite cold today, so take a warm jacket.", "focus": "/dʒ/ y vocales largas", "es_tip": "'jacket' con /dʒ/; 'cold' con 'ou' y 'warm' con 'oo' larga."}, {"level": "A2", "s": "My brother is taller than me, but I'm older than him.", "focus": "comparativos con schwa", "es_tip": "'-er' y 'than' suenan con schwa: TOO-luh dhun mi."}, {"level": "A2", "s": "How often do you play sport at the weekend?", "focus": "pregunta wh-, s + consonante", "es_tip": "Entonación que baja al final en preguntas con 'how'. 'sport' sin 'e'."}, {"level": "A2", "s": "I stopped eating meat about two years ago.", "focus": "-ed como /t/, schwa en 'about'", "es_tip": "'stopped' = STOPT; enlaza 'stopped eating' como 'stop-teating'."}, {"level": "A2", "s": "Excuse me, is there a bus station near here?", "focus": "s + consonante, preguntas sí/no", "es_tip": "'station' = STEI-shun. Entonación que sube al final."}, {"level": "A2", "s": "We decided to stay at home because it was raining.", "focus": "-ed como /ɪd/", "es_tip": "'decided' sí tiene sílaba extra: di-SAI-did."}, {"level": "B1", "s": "I've been working here since last year.", "focus": "contracción + since", "es_tip": "'I've been' = 'aiv bin'. Enlaza 'working here' y no pronuncies la 'r' de 'here'."}, {"level": "B1", "s": "If I had more free time, I'd travel around Asia.", "focus": "2º condicional, /v/", "es_tip": "'I'd' = AID. 'travel' con /v/. Pausa breve tras la coma."}, {"level": "B1", "s": "I'm use   if (!sc.imgs) return `<div class="scene"><div>${esc(sc.a)}</div><div>${esc(sc.b2)}</div></div>`;
  return `<div class="photos">${sc.imgs.map((n, i) => `<figure><img src="img/${n}.jpg" alt="${esc(i ? sc.b2 : sc.a)}" loading="lazy"><figcaption>${credit(n)}</figcaption></figure>`).join("")}</div>`;
}

/* ---------- conversación con IA ---------- */
const KEY = "ij-anthropic-key";
const TOPICS = [
  ["Tu ciudad", "the place where you live: what you like about it, what you would change"],
  ["Trabajo y estudios", "work and studies: your job, your degree, balancing both"],
  ["Viajes", "travelling: a trip you remember, a place you want to visit"],
  ["Tiempo libre", "free time, hobbies and weekends"],
  ["Tecnología", "technology and social media in everyday life"],
  ["Educación", "education and what makes a good teacher or school"],
  ["Comida", "food, cooking and eating out"],
  ["Salud y deporte", "health, sport and a healthy lifestyle"],
  ["Medio ambiente", "the environment and small things people can do"],
  ["Planes de futuro", "your plans for the future and your career goals"]
];
let C = null;
function chatHome() {
  R = { kind: "charla", items: [], k: 0, res: [] };
  const key = ls.get(KEY);
  $("#main").innerHTML = `<div class="wrap">
    <div class="row" style="justify-content:space-between"><button class="back" data-a="home">‹ Volver</button><span class="eyebrow">Conversación con IA</span></div>
    ${key ? "" : `<div class="keybox"><strong>Para hablar con Claude desde aquí hace falta una clave de la API de Anthropic</strong>
      <span class="note">Claude no deja usar el micrófono dentro de su app, y esta página no puede usar tu suscripción de claude.ai. Con tu propia clave, la conversación cuesta unos céntimos (aprox. 0,10–0,30 € por charla de 10 minutos) y se cobra en tu cuenta de la API, aparte de la suscripción.</span>
      <span class="note">1) Entra en console.anthropic.com › API keys, crea una clave y añade algo de saldo. 2) Pégala aquí. Se guarda solo en este móvil y solo se envía a api.anthropic.com.</span>
      <input id="key-in" type="password" autocomplete="off" placeholder="sk-ant-…" aria-label="Clave de la API de Anthropic">
      <div class="row"><button class="btn primary small" data-a="savekey">Guardar clave</button><a class="btn soft small" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Abrir la consola</a></div>
      <span class="note">Sin clave: elige un tema abajo y pulsa «Hablar en la app de Claude». Copio las instrucciones y las pegas en el modo voz de la app de Claude.</span></div>`}
    <p class="eyebrow">Elige de qué hablar</p>
    <div class="topics">${TOPICS.map(([t], i) => `<button data-topic="${i}">${esc(t)}</button>`).join("")}<button data-topic="foto">Sobre una foto</button></div>
    ${key ? `<div class="row"><button class="btn ghost small" data-a="delkey">Borrar la clave de este móvil</button></div>` : ""}
  </div>`;
}
function topicPrompt(t) {
  return t.photo ? `two photos for a speaking exam. Photo A: ${t.photo.a} Photo B: ${t.photo.b2} Start by asking the learner to compare them (as in Cambridge B2 First Speaking Part 2), then chat about the topic` : `this topic: ${t.desc}`;
}
const systemPrompt = t => `You are Alex, a friendly native English speaker chatting with a Spanish learner (around B1, preparing Cambridge B2 First Speaking). Talk about ${topicPrompt(t)}.
Rules: reply in natural spoken English, 1 to 3 short sentences, then ask one follow-up question to keep the conversation going. Use vocabulary a B1-B2 learner can follow. Do not correct mistakes during the chat; if something is unclear, ask what they meant. The learner's words come from speech recognition, so ignore missing punctuation. Never use lists, emojis or markdown.`;
async function claudeCall(system, messages, maxTokens = 1024) {
  const key = ls.get(KEY);
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true", "anthropic-beta": "server-side-fallback-2026-07-01" },
    body: JSON.stringify({ model: "claude-opus-5-5", max_tokens: maxTokens, output_config: { effort: "low" }, fallbacks: "default", system, messages })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j?.error?.message || ("HTTP " + r.status)); e.status = r.status; throw e; }
  if (j.stop_reason === "refusal") throw new Error("Claude no ha querido responder a eso. Prueba con otra frase.");
  return (j.content || []).filter(b => b.type === "text").map(b => b.text).join(" ").trim();
}
async function startChat(t) {
  C = { t, msgs: [], handsfree: ls.get("ij-handsfree") !== "0", busy: false };
  renderChat();
  if (!ls.get(KEY)) return;
  await aiTurn("(Start the conversation now with a short greeting and your first question.)", true);
}
function renderChat() {
  const t = C.t, key = ls.get(KEY);
  $("#main").innerHTML = `<div class="wrap">
    <div class="row" style="justify-content:space-between"><button class="back" data-a="chatback">‹ Temas</button><span class="eyebrow">${esc(t.title)}</span></div>
    ${t.photo ? photosHTML(t.photo) : ""}
    ${key ? `<div class="chat" id="chat">${C.msgs.map(m => `<div class="bub ${m.role === "assistant" ? "ai" : "me"}">${esc(m.content)}${m.role === "assistant" ? ` <button class="btn ghost small" data-say="${esc(m.content)}">Oír</button>` : ""}</div>`).join("")}${C.busy ? `<div class="bub ai typing">Alex está pensando…</div>` : ""}</div>
      ${stage()}
      <label class="toggle"><input type="checkbox" id="hf" ${C.handsfree ? "checked" : ""}> Manos libres: al terminar Alex, el micro se abre solo</label>
      <div class="row"><button class="btn soft" data-a="chatend" ${C.msgs.filter(m => m.role === "user").length ? "" : "disabled"}>Terminar y ver mis correcciones</button></div>
      <div id="fb"></div>` : `<div class="keybox"><strong>Sin clave de API</strong><span class="note">Copia estas instrucciones, abre la app de Claude, pégalas y activa el modo voz para charlar.</span>
      <div class="row"><button class="btn primary" data-a="copyprompt">Copiar instrucciones</button><a class="btn soft" href="https://claude.ai/new" target="_blank" rel="noopener">Abrir Claude</a></div><span class="note" id="copied"></span></div>`}
  </div>`;
  const ch = $("#chat"); if (ch) ch.lastElementChild?.scrollIntoView({ block: "nearest" });
}
async function aiTurn(userText, hidden) {
  if (!hidden) C.msgs.push({ role: "user", content: userText });
  C.busy = true; renderChat();
  const msgs = hidden ? [{ role: "user", content: userText }] : (C.msgs[0]?.hiddenStart ? [{ role: "user", content: C.msgs[0].hiddenStart }, ...C.msgs.slice(0)] : C.msgs);
  try {
    const reply = await claudeCall(systemPrompt(C.t), cleanMsgs(hidden ? msgs : withStart(C.msgs)), 1024);
    C.busy = false; C.msgs.push({ role: "assistant", content: reply }); renderChat();
    speakThen(reply, () => { if (C && C.handsfree && !recOn) micPressed(); });
  } catch (e) {
    C.busy = false; renderChat();
    onFail(e.status === 401 ? "La clave no es válida. Bórrala y pega otra." : e.status === 429 ? "Demasiadas peticiones o sin saldo en tu cuenta de la API." : "No he podido contactar con Claude: " + e.message);
  }
}
const START = "(Start the conversation now with a short greeting and your first question.)";
function withStart(ms) { return [{ role: "user", content: START }, ...ms]; }
function cleanMsgs(ms) { // fusiona turnos seguidos del mismo rol
  const out = []; for (const m of ms) { if (out.length && out.at(-1).role === m.role) out.at(-1).content += " " + m.content; else out.push({ role: m.role, content: m.content }); } return out;
}
function speakThen(text, done) {
  if (!TTS) return done();
  try {
    speechSynthesis.cancel();
    const parts = String(text).match(/[^.!?]+[.!?]*/g) || [text];
    parts.forEach((p, i) => { const u = new SpeechSynthesisUtterance(p.trim()); const v = VOICE || pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } u.rate = 1; if (i === parts.length - 1) u.onend = () => setTimeout(done, 250); speechSynthesis.speak(u); });
  } catch { done(); }
}
async function chatFeedback() {
  const box = $("#fb"); if (box) box.innerHTML = `<div class="feed mid"><strong>Preparando tus correcciones…</strong></div>`;
  const transcript = C.msgs.map(m => (m.role === "user" ? "Learner: " : "Alex: ") + m.content).join("\n");
  const sys = "Eres profesor de inglés para hispanohablantes que preparan Cambridge B2 First. Analiza solo las frases del alumno (Learner). Vienen de reconocimiento de voz: ignora puntuación y mayúsculas.";
  const ask = `Conversación:\n${transcript}\n\nResponde SOLO con JSON: {"level":"A2|B1|B1+|B2","good":"una frase en español con lo que ha hecho bien","errors":[{"wrong":"frase exacta del alumno","right":"versión correcta","why":"explicación breve en español"}],"phrases":["2-4 expresiones de nivel B2 que podría haber usado, en inglés"],"tip":"un consejo concreto en español para el Speaking del examen"}. Máximo 6 errores, los más importantes.`;
  try {
    const txt = await claudeCall(sys, [{ role: "user", content: ask }], 2048);
    const j = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
    react((j.errors || []).length <= 2 ? "happy" : "sad");
    box.innerHTML = `<div class="feed ${(j.errors || []).length > 3 ? "mid" : ""}"><strong>Nivel aproximado: ${esc(j.level || "—")}</strong><span>${esc(j.good || "")}</span>
      ${(j.errors || []).map(e => `<span class="err"><span><s>${esc(e.wrong)}</s> → <b>${esc(e.right)}</b> <button class="btn ghost small" data-say="${esc(e.right)}">Oír</button></span><span class="tip">${esc(e.why)}</span></span>`).join("")}
      ${(j.phrases || []).length ? `<span>Para la próxima: ${j.phrases.map(p => `<b>${esc(p)}</b>`).join(" · ")}</span>` : ""}
      <span class="tip">${esc(j.tip || "")}</span></div>`;
    saveStat("charla", Math.max(0, 100 - (j.errors || []).length * 12));
  } catch (e) { box.innerHTML = `<div class="feed ko"><strong>No he podido preparar las correcciones</strong><span class="tip">${esc(e.message)}</span></div>`; }
}
const hash = location.hash.replace("#", "");
home();
if (hash && MODES.some(m => m[0] === hash)) start(hash);
document.addEventListener("change", e => { if (e.target.id === "hf" && C) { C.handsfree = e.target.checked; ls.set("ij-handsfree", C.handsfree ? "1" : "0"); } });
})();
</script>
